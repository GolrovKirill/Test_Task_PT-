name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Full build + all tests (including integration tests against PostgreSQL) on Linux.
  build-test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: pt_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration-test database is created automatically by TestHost if missing.
      TEST_DB_CONNECTION: >-
        Host=127.0.0.1;Port=5432;Database=pt_test_db_tests;Username=postgres;Password=${{ secrets.TEST_DB_PASSWORD || 'postgres' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: >-
          dotnet test tests/PT.Tests/PT.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Windows sanity check: build + unit tests only (no PostgreSQL service available).
  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test tests/PT.Tests/PT.Tests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName~PT.Tests.Unit"
