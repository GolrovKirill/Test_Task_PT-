services:
  postgres:
    image: postgres:17
    container_name: pt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pt_test_db
    ports:
      - "5432:5432"
    volumes:
      - pt-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pt_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pt-pgdata:
